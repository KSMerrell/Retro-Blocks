<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2a34"><title>Retro Blox</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font:16px 'Source Sans 3',system-ui,sans-serif;color:#222;min-height:100vh;background:linear-gradient(180deg,#5fb2f2 0,#a9d9fa 58%,#74c26e 58%,#4f9d4f 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:900px;width:100%}
.left{flex:1 1 300px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.45)}.left img{width:min(100%,360px);display:block;margin-bottom:14px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}.left h1{font-size:34px;margin:0 0 8px}.left p{font-size:18px;margin:0}
.card{flex:0 1 340px;width:340px;max-width:100%;background:#fff;border:1px solid #999;box-shadow:0 3px 10px rgba(0,0,0,.3);padding:20px}
.tabs{display:flex;margin:-20px -20px 14px;border-bottom:1px solid #ddd}.tabs button{flex:1;padding:12px;border:0;background:#f2f2f2;font:inherit;font-weight:700;color:#666;cursor:pointer}.tabs button.on{background:#fff;color:#222;box-shadow:inset 0 3px 0 #00a2ff}
label{display:block;font-weight:600;margin:10px 0 4px}input{width:100%;padding:9px 10px;border:1px solid #b8b8b8;border-radius:3px;font:inherit}
.btn{width:100%;margin-top:14px;padding:11px;border:0;border-radius:3px;background:#02b757;color:#fff;font:inherit;font-size:20px;font-weight:700;cursor:pointer}.btn:hover{background:#26d070}.btn[disabled]{opacity:.6}
.err{color:#e2231a;min-height:20px;margin-top:8px;font-size:14px}.fine{font-size:12px;color:#777;margin:10px 0 0}
</style></head><body><div class="wrap"><div class="left"><img src="/word.png" alt="Retro Blox"><h1>Build it. Play it. Share it.</h1><p>Hop into blocky worlds with real friends, dress up your avatar, and publish games of your own.</p></div>
<div class="card"><div class="tabs"><button id="tSign" class="on" type="button">Sign Up</button><button id="tLog" type="button">Log In</button></div>
<form id="f" autocomplete="on"><label for="u">Username</label><input id="u" name="username" maxlength="20" autocomplete="username" placeholder="3 to 20 letters, numbers or _" required><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required><div class="err" id="e" role="alert"></div><button class="btn" id="go">Sign Up</button><button type="button" class="btn" id="inst" hidden style="background:#00a2ff;font-size:16px">Install the App</button><p class="fine" id="fine">Pick a name that is not your real name. Everyone you meet here is a real person.</p></form><div id="gst" style="margin-top:14px;border-top:1px solid #ddd;padding-top:12px"><div style="font-weight:700;margin-bottom:8px">Or play as a guest</div><div style="display:flex;gap:8px"><button type="button" class="btn" data-g="boy" style="margin:0;background:#00a2ff;font-size:17px">Boy</button><button type="button" class="btn" data-g="girl" style="margin:0;background:#e0589a;font-size:17px">Girl</button></div><p class="fine">No account needed. You can save your progress later.</p></div></div></div>
<script>
let mode='signup';const $=i=>document.getElementById(i);
function set(m){mode=m;$('tSign').classList.toggle('on',m==='signup');$('tLog').classList.toggle('on',m==='login');$('go').textContent=m==='signup'?'Sign Up':'Log In';$('p').autocomplete=m==='signup'?'new-password':'current-password';$('p').placeholder=m==='signup'?'At least 6 characters':'Your password';$('fine').hidden=m!=='signup';$('e').textContent='';}
$('tSign').onclick=()=>set('signup');$('tLog').onclick=()=>set('login');
if(window.MUST){document.querySelector('.tabs').hidden=true;$('gst').hidden=true;$('u').value=window.MUST;$('u').readOnly=true;$('u').autocomplete='username';$('p').placeholder='Choose a new password (6+ characters)';$('p').autocomplete='new-password';document.querySelector('label[for=p]').textContent='New password';$('go').textContent='Save New Password';$('fine').hidden=false;$('fine').textContent='An admin reset your password. Pick a new one to continue.';}
$('f').onsubmit=async e=>{if(window.MUST){e.preventDefault();$('go').disabled=true;$('e').textContent='';try{const r=await fetch('/api/changepw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('p').value})});const j=await r.json();if(r.ok){location.href='/';return}$('e').textContent=j.error||'Something went wrong.'}catch(x){$('e').textContent='Could not reach the server.'}$('go').disabled=false;return}e.preventDefault();$('go').disabled=true;$('e').textContent='';try{const r=await fetch('/api/'+(mode==='signup'?'signup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});const j=await r.json();if(r.ok){location.href='/';return}$('e').textContent=j.error||'Something went wrong.'}catch(x){$('e').textContent='Could not reach the server.'}$('go').disabled=false};
document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=async function(){document.querySelectorAll('[data-g]').forEach(function(x){x.disabled=true});$('e').textContent='';try{var r=await fetch('/api/guest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gender:b.dataset.g})});var j=await r.json();if(r.ok){location.href='/';return}$('e').textContent=j.error||'Something went wrong.'}catch(x){$('e').textContent='Could not reach the server.'}document.querySelectorAll('[data-g]').forEach(function(x){x.disabled=false})}});
let di=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();di=e;$('inst').hidden=false});$('inst').onclick=async()=>{if(di){di.prompt();di=null}};
(function(){var l=[];try{l=JSON.parse(localStorage.getItem('rbaccts')||'[]')}catch(e){}l=(Array.isArray(l)?l:[]).filter(function(a){return a&&a.name&&a.token});if(!l.length)return;var b=document.createElement('div');b.style.cssText='margin-top:14px;border-top:1px solid #ddd;padding-top:12px';b.innerHTML='<div style="font-weight:700;margin-bottom:8px">Saved accounts</div>';l.forEach(function(a){var x=document.createElement('button');x.type='button';x.className='btn';x.style.cssText='display:block;width:100%;margin:0 0 6px;background:#00a2ff';x.textContent='Continue as '+a.name;x.onclick=async function(){x.disabled=true;try{var r=await fetch('/api/acct/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:a.token})});if(r.ok){location.href='/';return}}catch(e){}var k=l.filter(function(q){return q!==a&&q.token!==a.token});try{localStorage.setItem('rbaccts',JSON.stringify(k))}catch(e){}x.textContent=a.name+' (expired, log in again)'};b.appendChild(x)});document.querySelector('.card').appendChild(b)})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>

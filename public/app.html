<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2a34"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Retro Blox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: classic blocky site chrome. Dark top bar, light left menu, white content boxes on a pale grey page. */
:root{
  --bar:#232527; --bar-line:#393b3d; --page:#e3e3e3; --box:#fff; --line:#cfcfcf; --soft:#f2f2f2;
  --ink:#343434; --muted:#757575; --link:#0055b3; --blue:#00a2ff; --blue-d:#0074bd; --green:#02b757; --green-d:#018a42;
  --red:#e2231a; --tix:#c79a00; --gold:#f2b705;
  --ui:'Source Sans 3','Source Sans Pro','Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.35 var(--ui)}
body.in-game{overflow:hidden}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:var(--ui);font-size:15px}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
img{max-width:100%}
h1,h2,h3{margin:0;font-weight:700}
.hide{display:none!important}
.muted{color:var(--muted)}

/* ---- header ---- */
#hdr{position:fixed;top:0;left:0;right:0;height:40px;background:var(--bar);z-index:50;border-bottom:1px solid #111}
.hwrap{max-width:1040px;margin:0 auto;height:100%;display:flex;align-items:center;gap:6px;padding:0 max(10px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:7px;color:#fff;font-weight:900;letter-spacing:.08em;font-size:16px;margin-right:10px;text-decoration:none!important}
.logo img{display:block}
.hmark{height:24px;width:auto;background:#fff;border-radius:3px;padding:3px 5px;box-sizing:border-box}
.hword{height:15px;width:auto;filter:brightness(0) invert(1)}
#hdr nav{display:flex;height:100%}
#hdr nav a{color:#fff;font-weight:600;padding:0 12px;display:flex;align-items:center;height:100%;font-size:15px;text-decoration:none}
#hdr nav a:hover,#hdr nav a.on{background:#3b3e41}
#searchf{margin-left:8px;display:flex;flex:1;max-width:230px}
#searchf input{width:100%;height:26px;border:1px solid #111;border-radius:2px 0 0 2px;padding:0 8px;background:#fff;color:#333}
#searchf button{width:30px;border:1px solid #111;border-left:0;background:#cfcfcf;border-radius:0 2px 2px 0;cursor:pointer;padding:0;display:grid;place-items:center}
.hright{margin-left:auto;display:flex;align-items:center;gap:2px;height:100%}
.hbtn{position:relative;height:100%;min-width:38px;display:flex;align-items:center;justify-content:center;color:#fff;padding:0 8px;cursor:pointer;background:none;border:0;gap:5px;font-weight:600;text-decoration:none}
.hbtn:hover{background:#3b3e41;text-decoration:none}
.badge-n{position:absolute;top:4px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#e2231a;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.drop{position:absolute;top:40px;right:0;width:210px;background:#fff;border:1px solid #888;box-shadow:0 4px 8px rgba(0,0,0,.35);color:var(--ink);z-index:60}
.drop a,.drop div{display:block;padding:8px 12px;color:var(--ink);border-bottom:1px solid #eee;font-size:14px;font-weight:400;text-align:left}
.drop a:hover{background:#f2f2f2;text-decoration:none}
.hlogin{display:flex;gap:8px;align-items:center}

/* ---- layout ---- */
#shell{padding-top:40px;min-height:100%;display:flex;flex-direction:column}
#wrap{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:12px max(10px,env(safe-area-inset-left,0px)) 24px;display:flex;gap:12px;align-items:flex-start}
#side{width:158px;flex:none;background:var(--box);border:1px solid var(--line);box-shadow:0 1px 3px rgba(150,150,150,.4);position:sticky;top:52px}
#side a{display:flex;align-items:center;gap:10px;padding:9px 12px;color:var(--ink);font-weight:600;border-bottom:1px solid #eee;text-decoration:none}
#side a:last-child{border-bottom:0}
#side a svg{width:18px;height:18px;flex:none;fill:#666}
#side a:hover{background:var(--soft)}
#side a.on{background:#e6f4ff;color:#0074bd}
#side a.on svg{fill:#0074bd}
#side .cnt{margin-left:auto;background:var(--blue);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}
#app{flex:1;min-width:0}
#foot{background:var(--box);border-top:1px solid var(--line);text-align:center;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted)}
#foot nav{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
#foot nav a{color:var(--ink);font-weight:600}
@media (max-width:760px){
  #wrap{flex-direction:column}
  #side{width:100%;position:static;display:flex;overflow-x:auto}
  #side a{border-bottom:0;border-right:1px solid #eee;white-space:nowrap}
  #hdr nav a{padding:0 8px;font-size:14px}
  #searchf{display:none}
}

/* ---- boxes ---- */
.box{background:var(--box);border:1px solid var(--line);box-shadow:0 1px 3px rgba(150,150,150,.4);padding:14px;margin-bottom:12px}
.box.flush{padding:0}
.box>h2,.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:20px;font-weight:700}
.sec-h a{font-size:14px;font-weight:600}
.page-h{font-size:28px;font-weight:700;margin:0 0 10px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:-14px -14px 14px;background:var(--soft);overflow-x:auto}
.tabs a{padding:10px 16px;color:var(--muted);font-weight:600;white-space:nowrap;border-right:1px solid var(--line);text-decoration:none}
.tabs a.on{background:#fff;color:var(--ink);box-shadow:inset 0 3px 0 var(--blue);margin-bottom:-1px}
.tabs a:hover{color:var(--ink);background:#fafafa}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:6px 16px;border:1px solid transparent;border-radius:3px;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none!important;line-height:1.3;font-size:15px}
.btn:hover{background:#32b5ff}
.btn:active{background:var(--blue-d)}
.btn.green{background:var(--green)}.btn.green:hover{background:#26d070}
.btn.neutral{background:#fff;color:#555;border-color:#b8b8b8}.btn.neutral:hover{background:#f5f5f5}
.btn.red{background:var(--red)}.btn.red:hover{background:#f04a42}
.btn.big{font-size:22px;padding:10px 34px}
.btn.small{font-size:13px;padding:3px 10px}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=search],textarea,select{border:1px solid #b8b8b8;border-radius:3px;padding:6px 8px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-weight:600;margin:10px 0 4px}

.tok,.tix{display:inline-block;vertical-align:-2px;width:14px;height:14px;margin-right:3px}
.tok{background:radial-gradient(circle at 35% 30%,#ffe27a,#f0b800 60%,#b98400);border-radius:50%;box-shadow:inset 0 0 0 2px #d99a00}
.tix{background:#8e5bd9;clip-path:none;border-radius:2px;height:11px;width:15px;vertical-align:-1px}
.price{color:#b27a00;font-weight:700}
.price.t{color:var(--tix)}
.free{color:var(--muted);font-weight:600}

/* ---- grids / cards ---- */
.row{display:flex;gap:10px;flex-wrap:wrap}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.gcard{display:block;color:var(--ink);text-decoration:none!important;font-size:13px}
.gcard .im{aspect-ratio:1;background:#ddd;position:relative;border:1px solid #bbb;overflow:hidden}
.gcard .im img{width:100%;height:100%;display:block;object-fit:cover}
.gcard:hover .im{border-color:var(--blue)}
.gcard b{display:block;font-size:15px;margin:5px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.gcard:hover b{color:var(--link)}
.rate{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.rate .bar{flex:1;height:7px;background:#c5c5c5;position:relative;border-radius:1px}
.rate .bar i{position:absolute;inset:0 auto 0 0;background:#02b757;border-radius:1px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pcard{text-align:center;color:var(--ink);font-size:13px;text-decoration:none!important;display:block}
.pcard .im{background:#f6f6f6;border:1px solid #ddd;position:relative}
.pcard img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pcard b{display:block;font-weight:600;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{position:absolute;right:5px;bottom:5px;width:11px;height:11px;border-radius:50%;background:#02b757;border:2px solid #fff}
.dot.play{background:var(--blue)}
.pcard:hover b{color:var(--link)}
.status{font-size:12px;color:var(--muted)}
.item .im img{background:#f6f6f6}
.ltd{position:absolute;left:0;top:0;background:#2e2e2e;color:#fff;font-size:11px;font-weight:700;padding:1px 6px;letter-spacing:.05em}
.owned{position:absolute;right:0;bottom:0;background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:1px 6px}
.worn{position:absolute;left:0;bottom:0;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:1px 6px}

/* ---- landing ---- */
.landing{min-height:calc(100vh - 40px);background:linear-gradient(180deg,#5fb2f2 0,#a9d9fa 58%,#74c26e 58%,#4f9d4f 100%);position:relative;overflow:hidden;display:flex;align-items:center}
.landing::before{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 70px,rgba(0,0,0,.05) 70px 140px)}
.land-in{position:relative;max-width:1040px;margin:0 auto;padding:30px max(16px,env(safe-area-inset-left,0px));width:100%;display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.land-left{flex:1 1 380px;min-width:0;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.land-left img.wm{width:min(460px,100%);height:auto;display:block;margin-bottom:6px}
.land-left svg{width:min(420px,100%);height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.land-left h2{font-size:34px;margin:10px 0 6px;font-weight:900;text-wrap:balance}
.land-left p{font-size:19px;margin:0 0 14px;max-width:26em}
.land-games{display:flex;gap:8px}
.land-games img{width:84px;height:84px;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.signup{flex:0 1 330px;width:330px;max-width:100%;background:#fff;border:1px solid #999;box-shadow:0 3px 10px rgba(0,0,0,.35);padding:18px;color:var(--ink);text-shadow:none}
.signup h3{font-size:21px;margin-bottom:8px}
.signup .sel{display:flex;gap:6px}
.signup .sel select{flex:1;min-width:0;padding:6px 4px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
.gender{display:flex;gap:8px}
.gender button{flex:1;padding:8px;border:1px solid #b8b8b8;background:#fff;cursor:pointer;border-radius:3px;font-weight:600}
.gender button.on{background:#e6f4ff;border-color:var(--blue);color:#0074bd}

/* ---- home ---- */
.hello{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hello .avs{width:130px;height:130px;background:linear-gradient(#e8f4ff,#fff);border:1px solid #ddd;flex:none}
.hello .avs img{width:100%;height:100%;display:block}
.hello h1{font-size:30px}
.pillrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;align-items:center}
.feedin{display:flex;gap:8px;margin-bottom:10px}
.feedin input{flex:1}
.post{display:flex;gap:10px;padding:10px 0;border-top:1px solid #eee}
.post img{width:54px;height:54px;background:#f1f1f1;border:1px solid #ddd;flex:none}
.post .who{font-weight:700}.post .t{color:var(--muted);font-size:12px}
.post p{margin:2px 0 0;word-break:break-word}

/* ---- game page ---- */
.gp{display:flex;gap:16px;flex-wrap:wrap}
.gp .shot{flex:0 1 480px;min-width:0;width:100%}
.gp .shot img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border:1px solid #bbb}
.gp .info{flex:1 1 280px;min-width:0}
.gp h1{font-size:30px}
.vote{display:flex;align-items:center;gap:10px;margin-top:12px}
.vote button{background:none;border:0;cursor:pointer;color:#888;display:flex;align-items:center;gap:4px;padding:4px}
.vote button.on{color:var(--blue)}
.vote button svg{width:22px;height:22px;fill:currentColor}
.vote .bar{flex:1;height:6px;background:#c5c5c5;max-width:160px}.vote .bar i{display:block;height:100%;background:var(--green)}
.statline{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0;text-align:center}
.statline div{border:1px solid #e0e0e0;padding:8px 4px}
.statline b{display:block;font-size:17px}.statline span{font-size:12px;color:var(--muted)}
.srv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #eee;flex-wrap:wrap}
.srv .heads{display:flex;gap:3px;flex:1;min-width:120px}
.srv .heads img{width:36px;height:36px;border:1px solid #ddd;background:#f1f1f1}

/* ---- catalog ---- */
.cat-wrap{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cat-side{width:170px;flex:none}
.cat-side a{display:block;padding:7px 10px;color:var(--ink);font-weight:600;border-bottom:1px solid #eee}
.cat-side a.on{background:#e6f4ff;color:#0074bd}
.cat-side a:hover{background:var(--soft);text-decoration:none}
.cat-main{flex:1;min-width:260px}
.itm{display:flex;gap:18px;flex-wrap:wrap}
.itm .big{flex:0 1 300px;width:100%;position:relative}
.itm .big img{width:100%;aspect-ratio:1;background:linear-gradient(#f5f9ff,#fff);border:1px solid #ddd;display:block}
.itm .det{flex:1 1 260px;min-width:0}
.itm h1{font-size:28px}
.itm dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:14px 0}
.itm dt{color:var(--muted)}.itm dd{margin:0;font-weight:600}
.bigprice{font-size:24px;font-weight:700;margin:10px 0}

/* ---- avatar editor ---- */
.av-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.av-left{flex:0 1 340px;width:100%}
.av-stage{position:relative;background:linear-gradient(#cfe9ff,#f4faff);border:1px solid #ccc}
.av-stage img{width:100%;aspect-ratio:1;display:block}
.av-stage .rot{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.8);border:1px solid #aaa;cursor:pointer;font-size:18px;line-height:1}
.av-stage .rot.l{left:6px}.av-stage .rot.r{right:6px}
.bodyc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bodyc button{border:1px solid #bbb;background:#fff;padding:5px;cursor:pointer;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px}
.bodyc button i{width:16px;height:16px;border:1px solid #666;flex:none}
.bodyc button.on{border-color:var(--blue);background:#e6f4ff}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.pal button{aspect-ratio:1;border:2px solid #fff;outline:1px solid #999;cursor:pointer;padding:0}
.pal button:hover{outline-color:#000}
.av-right{flex:1 1 340px;min-width:0}

/* ---- lists ---- */
.lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #eee;flex-wrap:wrap}
.lrow:first-child{border-top:0}
.lrow img.s{width:60px;height:60px;background:#f1f1f1;border:1px solid #ddd;flex:none}
.lrow .grow{flex:1;min-width:140px}
.lrow b{font-weight:700}
.msgrow{display:flex;gap:10px;padding:9px 6px;border-top:1px solid #eee;cursor:pointer;align-items:baseline}
.msgrow.unread{font-weight:700;background:#f4faff}
.msgrow:hover{background:#f0f0f0}
.msgrow .f{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgrow .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgrow .d{color:var(--muted);font-size:12px;font-weight:400;flex:none}
.msgview{white-space:pre-wrap;word-break:break-word;padding:10px 0}
.trbox{display:flex;gap:10px;flex-wrap:wrap}
.trbox .col{flex:1 1 220px;border:1px solid #ddd;padding:8px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;border:1px solid #ccc;padding:2px 8px 2px 2px;background:#fff;font-size:13px}
.chip img{width:34px;height:34px;background:#f1f1f1}
.selitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;max-height:240px;overflow-y:auto}
.selitems label{display:block;border:2px solid #ddd;padding:2px;cursor:pointer;font-size:12px;text-align:center;position:relative;background:#fff}
.selitems label:has(input:checked){border-color:var(--blue);background:#e6f4ff}
.selitems input{position:absolute;opacity:0;pointer-events:none}
.selitems img{width:100%;aspect-ratio:1;display:block;background:#f4f4f4}
.emblem{width:100px;height:100px;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:46px;border:1px solid rgba(0,0,0,.2)}
.emblem.s{width:60px;height:60px;font-size:26px}
.badgeg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.bdg{text-align:center;font-size:13px}
.bdg .c{width:76px;height:76px;margin:0 auto 4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#e0a100);display:grid;place-items:center;font-weight:900;font-size:26px;color:#6b4a00;border:3px solid #fff;box-shadow:0 0 0 1px #c89200}
.bdg.locked .c{background:#ddd;color:#aaa;box-shadow:0 0 0 1px #bbb}
.prof{display:flex;gap:16px;flex-wrap:wrap}
.prof .pav{flex:0 0 230px;width:100%;max-width:300px}
.prof .pav img{width:100%;aspect-ratio:1;display:block;background:linear-gradient(#e0f0ff,#fff);border:1px solid #ddd}
.prof .pinfo{flex:1 1 260px;min-width:0}
.prof h1{font-size:30px}
.pstats{display:flex;gap:0;margin:12px 0;border:1px solid #ddd}
.pstats div{flex:1;text-align:center;padding:8px 4px;border-right:1px solid #ddd}
.pstats div:last-child{border:0}
.pstats b{display:block;font-size:19px}.pstats span{font-size:12px;color:var(--muted)}

/* ---- modal / alerts ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#modal .mbox{background:#fff;border:1px solid #666;box-shadow:0 8px 24px rgba(0,0,0,.5);width:min(480px,100%);margin:auto}
#modal .mh{background:#e1e1e1;border-bottom:1px solid #bbb;padding:10px 14px;font-weight:700;font-size:18px;display:flex;justify-content:space-between}
#modal .mb{padding:16px}
#modal .mf{padding:10px 16px 16px;display:flex;gap:8px;justify-content:flex-end}
#alertbar{position:fixed;top:40px;left:0;right:0;z-index:55;text-align:center;pointer-events:none}
#alertbar div{display:inline-block;margin-top:8px;background:#2c93d6;color:#fff;font-weight:600;padding:8px 22px;border:1px solid #1d6fa5;box-shadow:0 2px 6px rgba(0,0,0,.3);animation:drop .25s ease-out;max-width:90vw}
#alertbar div.bad{background:#d9534f;border-color:#a94442}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}

/* ---- chat & party ---- */
#cp{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:0;z-index:70;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#cp>*{pointer-events:auto}
.cpwin{width:230px;background:#fff;border:1px solid #888;border-bottom:0;box-shadow:0 0 6px rgba(0,0,0,.3);display:flex;flex-direction:column}
.cpwin .ch{background:#232527;color:#fff;padding:6px 10px;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
.cpwin .cb{height:200px;overflow-y:auto;padding:6px;font-size:13px;display:flex;flex-direction:column;gap:4px}

  if(type === 'time'){ val = Math.round(val * 10) / 10; if(val < 3 || (cur.t && cur.t <= val)) return; cur.t = val; } else { val = Math.floor(val); if(val <= 0 || (cur.s && cur.s >= val)) return; cur.s = val; }

/* ---- image helpers for uploads ---- */
function readImage(file, w, h, maxChars){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'), sc = Math.max(w / im.width, h / im.height), dw = im.width * sc, dh = im.height * sc;
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, (w - dw) / 2, (h - dh) / 2, dw, dh); URL.revokeObjectURL(url);
      let q = .85, d = cv.toDataURL('image/jpeg', q); while(d.length > maxChars && q > .3){ q -= .1; d = cv.toDataURL('image/jpeg', q); }
      if(d.length > maxChars) rej(new Error('big')); else res({data:d, cv});
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad')); }; im.src = url;
  });
}
function avgColor(cv){ const t = document.createElement('canvas'); t.width = t.height = 1; const g = t.getContext('2d'); g.drawImage(cv, 0, 0, 1, 1); const d = g.getImageData(0, 0, 1, 1).data; return '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join(''); }

    const n = $('#cgN').value.trim(), d = $('#cgD').value.trim(); if(n.length < 3){ $('#cgE').textContent = 'Group names need at least 3 characters.'; return false; } if(U.tokens < 100){ $('#cgE').textContent = 'You need 100 tokens.'; return false; } if(GROUPDOCS.some(g => g.name.toLowerCase() === n.toLowerCase())){ $('#cgE').textContent = 'That group name is taken.'; return false; }
    const id = newId(); U.tokens -= 100; persist(); DB.doc('groups/' + id).set({name:n, desc:d || 'A new group.', owner:MYID, emblem:BRICK_COLORS[Math.floor(Math.random() * 12) + 1][1], t:Date.now()}).then(() => DB.doc('members/' + id + '_' + MYID).set({gid:id, uid:MYID, t:Date.now()})).then(() => go('group/' + encodeURIComponent(id))).catch(() => toast('Could not create the group.', true));
  }}]),
  exR:() => { const n = Math.floor(+$('#exR').value); if(!(n > 0) || n > U.tokens){ toast('Enter a valid amount of tokens.', true); return; } U.tokens -= n; U.tix += n * 10; save(); toast('Exchanged ' + n + ' tokens for ' + n * 10 + ' tickets.'); render(); },
  exT:() => { const n = Math.floor(+$('#exT').value); if(!(n >= 10) || n > U.tix){ toast('Enter at least 10 tickets (and no more than you have).', true); return; } const r = Math.floor(n / 10); U.tix -= r * 10; U.tokens += r; save(); toast('Exchanged ' + r * 10 + ' tickets for ' + r + ' tokens.'); render(); },
  coShare:el => { const p = U.places[+el.dataset.p]; if(!p) return;
    modal('Co-build ' + p.name, '<p style="margin:0 0 8px">Pick friends who can edit this place with you. Everyone sees changes as they are saved. If two people edit at once, the most recent save wins, so talk while you build.</p>' + coPicker([]), [{label:'Cancel', cls:'neutral'}, {label:'Start', fn:() => {
      const ids = Array.prototype.map.call(document.querySelectorAll('.cock:checked'), c => c.value).slice(0, 7); if(!ids.length){ toast('Pick at least one friend.', true); return false; }
      const id = 'co' + newId(); DB.doc('cplaces/' + id).set({owner:MYID, name:p.name, eds:[MYID].concat(ids), bricks:packBricks(p.bricks), n:p.bricks.length, env:p.env || null, by:U.name, t:Date.now()}).then(() => { p.co = id; persist(); toast('Co-building started.'); render(); }).catch(() => toast('Could not start co-building. Try again.', true));
    }}]); },
  coManage:el => { const p = U.places[+el.dataset.p], c = p && COPLACES.find(x => x.id === p.co); if(!c){ toast('Loading, try again in a moment.', true); return; }
    modal('Co-building: ' + p.name, '<p style="margin:0 0 8px">Friends who can edit this place:</p>' + coPicker(c.eds), [{label:'Stop Co-building', cls:'neutral', fn:() => { DB.doc('cplaces/' + c.id).delete().catch(() => {}); delete p.co; persist(); render(); }}, {label:'Save', fn:() => { const ids = Array.prototype.map.call(document.querySelectorAll('.cock:checked'), x => x.value).slice(0, 7); DB.doc('cplaces/' + c.id).update({eds:[MYID].concat(ids)}).then(() => toast('Saved.')).catch(() => toast('Could not save.', true)); }}]); },
  coEdit:el => playGame(4, {co:el.dataset.id}),
  newPlace:() => { if(U.places.length >= 4){ toast('You can have at most 4 places.', true); return; }
    modal('New Place', '<p style="margin:0 0 8px">Start from a template. You can change everything afterwards.</p><div class="tpls">' + TEMPLATES.map((t, i) => '<label class="tpl"><input type="radio" name="tpl" value="' + t.id + '"' + (i === 0 ? ' checked' : '') + '><span class="ti">' + t.icon + '</span><span><b>' + esc(t.name) + '</b><br><span class="muted">' + esc(t.desc) + '</span></span></label>').join('') + '</div>', [{label:'Cancel', cls:'neutral'}, {label:'Create', fn:() => {
      const el = document.querySelector('input[name=tpl]:checked'), id = el ? el.value : 'base', t = templateData(id), tn = TEMPLATES.find(x => x.id === id);
      U.places.push({name:(id === 'base' ? 'Place ' : tn.name + ' ') + (U.places.length + 1), bricks:t.bricks, env:t.env || undefined}); persist(); render(); toast('Created from the ' + tn.name + ' template.');
    }}]); },
  renamePlace:el => { const p = U.places[+el.dataset.p]; modal('Rename Place', '<input id="rnP" type="text" maxlength="30" value="' + esc(p.name) + '">', [{label:'Cancel', cls:'neutral'}, {label:'Save', fn:() => { const v = $('#rnP').value.trim(); if(!v) return false; p.name = v; persist(); render(); }}]); },
  delPlace:el => { const i = +el.dataset.p; confirmBox('Delete Place', 'Delete <b>' + esc(U.places[i].name) + '</b>? This cannot be undone.' + (placeGame(U.places[i]) ? ' Its published game will be unpublished.' : ''), 'Delete', () => { const g = placeGame(U.places[i]); if(g) DB.doc('games/' + g.id).delete().catch(() => {}); U.places.splice(i, 1); persist(); render(); }, 'red'); },
  cpToggle:() => { cpMin = !cpMin; try{ localStorage.setItem('bbCpMin', cpMin ? '1' : '0'); }catch(e){} renderCP(); }, cpOpen:el => { const id = el.dataset.n; if(cpOpen.indexOf(id) < 0) cpOpen.push(id); if(cpOpen.length > 2) cpOpen.shift(); renderCP(); const i = $('[data-chat="' + id + '"]'); if(i) i.focus(); }, cpClose:el => { cpOpen = cpOpen.filter(x => x !== el.dataset.n); renderCP(); }
};
document.addEventListener('click', e => {
  if(!e.target.closest('.hbtn')){ const a = $('#balDrop'), b = $('#menuDrop'); if(a) a.hidden = true; if(b) b.hidden = true; }
  const t = e.target.closest('[data-act]'); if(!t) return; const fn = ACTIONS[t.dataset.act]; if(fn){ e.preventDefault(); fn(t); }
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('msgrow')) ACTIONS.openMsg(e.target); if(e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#searchf').addEventListener('submit', e => { e.preventDefault(); const v = $('#q').value.trim(); if(v) go('search?q=' + encodeURIComponent(v)); });
window.addEventListener('beforeunload', () => { try{ if(U) save(); }catch(e){} });

/* ===================== boot ===================== */
(function stamp(){ const y = $('#yr'), t = $('#todayDate'); if(y) y.textContent = new Date().getFullYear(); if(t) t.textContent = 'Today is ' + todayStr(); setInterval(() => { if(t) t.textContent = 'Today is ' + todayStr(); }, 600000); })();
document.addEventListener('click', e => { if(!Engine.active() && e.target.closest && e.target.closest('a,button,.btn,select,label,.tab')) Engine.uiTick(); }, true);
(async function boot(){
  render();
  const guard = setTimeout(() => { if(STATUS === 'loading'){ STATUS = 'gate'; render(); } }, 12000);
  try{
    const ok = await bootNet(); clearTimeout(guard);
    if(!ok){ render(); return; }
    if(STATUS === 'onboard'){ try{ const me = await USERCAP.me(); const n = String((me && me.name) || ''); window.__suggest = n; if(NAME_RE.test(n) && await finishOnboard(n)){} }catch(e){ console.warn(e); } }
    try{ if(ROOM && ROOM.onConnection) ROOM.onConnection(c => toast(c ? 'Reconnected.' : 'Connection lost. Reconnecting...', !c)); }catch(e){}
    if(STATUS === 'ready' && (!location.hash || location.hash === '#/')) location.hash = '#/home';
    render(); if(STATUS === 'ready') setTimeout(dailyModal, 1500);
  }catch(e){ clearTimeout(guard); console.warn(e); STATUS = 'gate'; render(); }
})();

</script>

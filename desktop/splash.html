<!doctype html><html><head><meta charset="utf-8"><title>Retro Blox</title><style>
html,body{margin:0;height:100%;background:#fff;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #cfcfcf;box-sizing:border-box}
img{width:190px;height:auto;display:block;margin-bottom:34px}
p{margin:0 0 16px;font-size:13px;color:#111}
.bar{width:calc(100% - 64px);height:20px;background:#e6e6e6;border:1px solid #cfcfcf}
.bar i{display:block;height:100%;width:0;background:#0db02b;animation:f 10s linear forwards}
@keyframes f{to{width:100%}}
</style></head><body><img src="mark.png" alt="RB"><p>Checking for updates...</p><div class="bar"><i></i></div></body></html>

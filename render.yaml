services:
  - type: web
    name: blox-p3
    runtime: node
    plan: starter
    buildCommand: "echo no build"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: blox-data
      mountPath: /var/data
      sizeGB: 1
